<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShiftFit</title>

<style>
:root{
  --bg:#0d1020;
  --card:#202641;
  --card2:#2b314d;
  --text:#f1f1f5;
  --muted:#b6bdd0;
  --purple:#8b5cf6;
  --purple2:#6366d8;
  --green:#86d7bd;
  --border:#465176;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
  font-family:inherit;
}

.app{
  max-width:760px;
  margin:auto;
  padding:32px 20px 60px;
}

.logo{
  font-size:30px;
  font-weight:950;
  letter-spacing:-1px;
  margin-bottom:55px;
}

.logo span{
  color:#a78bfa;
}

.hidden{
  display:none !important;
}

.center{
  text-align:center;
}

.hero-title{
  font-size:52px;
  line-height:1.05;
  margin:10px 0 18px;
  font-weight:900;
  letter-spacing:-2px;
}

.subtitle{
  color:var(--muted);
  font-size:20px;
  line-height:1.5;
  margin-bottom:35px;
}

.week-label{
  color:#c4b5fd;
  font-weight:900;
  letter-spacing:5px;
  font-size:15px;
  margin-top:10px;
}

.plan-card,
.exercise-card{
  background:var(--card);
  border:2px solid var(--border);
  border-radius:32px;
  padding:28px;
  margin:22px 0;
}

.plan-card{
  cursor:pointer;
  transition:.2s;
  position:relative;
}

.plan-card:active{
  transform:scale(.98);
}

.plan-card.completed-day{
  border-color:var(--green);
}

.day-label{
  color:#bba7ff;
  font-weight:900;
  letter-spacing:3px;
  font-size:14px;
}

.plan-title{
  font-size:30px;
  margin:12px 0 20px;
}

.tag{
  display:inline-block;
  background:#173d38;
  color:var(--green);
  padding:10px 18px;
  border-radius:18px;
  font-weight:800;
}

.plan-text{
  color:var(--muted);
  font-size:18px;
  line-height:1.7;
}

.day-complete{
  position:absolute;
  top:28px;
  right:28px;
  background:var(--green);
  color:#163c34;
  width:42px;
  height:42px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:900;
}

.back-button{
  background:transparent;
  color:var(--text);
  border:2px solid var(--border);
  border-radius:18px;
  padding:13px 18px;
  font-size:16px;
  font-weight:800;
  margin-bottom:22px;
  cursor:pointer;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:28px 0 38px;
}

.stat{
  background:var(--card2);
  border-radius:24px;
  padding:22px 8px;
  text-align:center;
}

.stat small{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:8px;
  letter-spacing:1px;
}

.stat strong{
  font-size:18px;
}

.progress-wrap{
  margin:20px 0 30px;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  margin-bottom:10px;
  font-weight:700;
}

.progress-bar{
  height:14px;
  background:#1b2036;
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--border);
}

.progress-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,var(--purple),var(--green));
  transition:width .3s;
}

.exercise-card{
  display:flex;
  gap:20px;
  align-items:flex-start;
  cursor:pointer;
  transition:.2s;
}

.exercise-card:active{
  transform:scale(.985);
}

.exercise-card.completed{
  border-color:var(--green);
  background:#1b2c36;
}

.check{
  width:58px;
  height:58px;
  min-width:58px;
  border-radius:18px;
  background:#f1f1f1;
  border:3px solid #bfc3cb;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#163c34;
  font-size:28px;
  font-weight:900;
}

.completed .check{
  background:var(--green);
  border-color:var(--green);
}

.exercise-content{
  flex:1;
}

.exercise-title{
  font-size:26px;
  font-weight:900;
  margin-bottom:8px;
}

.exercise-sets{
  color:var(--green);
  font-size:18px;
  font-weight:900;
  margin-bottom:16px;
}

.exercise-tip{
  color:var(--muted);
  font-size:17px;
  line-height:1.5;
}

.finish-button{
  width:100%;
  border:none;
  border-radius:22px;
  padding:22px;
  margin-top:20px;
  font-size:23px;
  font-weight:900;
  color:white;
  background:#303750;
  opacity:.5;
  transition:.3s;
}

.finish-button.ready{
  opacity:1;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
}

.finish-button:disabled{
  cursor:not-allowed;
}

.success{
  text-align:center;
  padding:80px 20px;
}

.success-icon{
  font-size:80px;
}

.success h1{
  font-size:46px;
  margin-bottom:15px;
}

.success p{
  color:var(--muted);
  font-size:20px;
  line-height:1.5;
}

.next-day{
  width:100%;
  border:none;
  border-radius:22px;
  padding:22px;
  margin-top:30px;
  font-size:22px;
  font-weight:900;
  color:white;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
}

@media(max-width:520px){

  .app{
    padding:28px 16px 50px;
  }

  .hero-title{
    font-size:44px;
  }

  .stats{
    gap:8px;
  }

  .stat strong{
    font-size:15px;
  }

  .exercise-title{
    font-size:23px;
  }

  .plan-card,
  .exercise-card{
    padding:22px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">SHIFT<span>FIT</span></div>


  <!-- 7 DAY PLAN SCREEN -->
  <section id="planScreen">

    <div class="center">
      <div class="week-label">YOUR PERSONALISED WEEK</div>

      <h1 class="hero-title">
        Andrew's 7-day<br>plan 💪
      </h1>

      <p class="subtitle">
        Complete what you can. ShiftFit is about consistency, not perfection.
      </p>
    </div>

    <div id="planCards"></div>

  </section>


  <!-- WORKOUT SCREEN -->
  <section id="workoutScreen" class="hidden">

    <button class="back-button" onclick="showPlan()">
      ← BACK TO MY PLAN
    </button>

    <div id="workoutDayLabel" class="week-label"></div>

    <h1 id="workoutTitle" class="hero-title"></h1>

    <p id="workoutSubtitle" class="subtitle"></p>

    <div class="stats">

      <div class="stat">
        <small>TIME</small>
        <strong id="workoutTime"></strong>
      </div>

      <div class="stat">
        <small>LEVEL</small>
        <strong id="workoutLevel"></strong>
      </div>

      <div class="stat">
        <small>FOCUS</small>
        <strong id="workoutFocus"></strong>
      </div>

    </div>

    <div class="progress-wrap">

      <div class="progress-top">
        <span>WORKOUT PROGRESS</span>
        <span id="progressText">0 / 0</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

    </div>

    <div id="exerciseList"></div>

    <button id="finishButton"
      class="finish-button"
      disabled
      onclick="finishWorkout()">
      COMPLETE ALL EXERCISES
    </button>

  </section>


  <!-- SUCCESS SCREEN -->
  <section id="successScreen" class="hidden">

    <div class="success">

      <div class="success-icon">🏆</div>

      <h1>Workout complete!</h1>

      <p id="successMessage"></p>

      <p>
        <strong id="successMotivation">
          Keep building the habit. 💪
        </strong>
      </p>

      <button class="next-day" onclick="showPlan()">
        VIEW MY 7-DAY PLAN
      </button>

    </div>

  </section>

</div>


<script>

/* =========================
   SHIFT FIT WORKOUT DATA
========================= */

const workoutPlan = [

  {
    day: 1,
    title: "Upper Body",
    tag: "Strength",
    time: "45 min",
    level: "Beginner",
    focus: "Strength",
    description: "Build upper-body strength with controlled movements.",
    exercises: [
      {
        name: "Push-ups",
        sets: "3 sets × 8–12 reps",
        tip: "Keep your body straight and lower under control."
      },
      {
        name: "Dumbbell Rows",
        sets: "3 sets × 10 reps",
        tip: "Pull your elbow towards your hip."
      },
      {
        name: "Shoulder Press",
        sets: "3 sets × 8–12 reps",
        tip: "Keep your core tight and control the weight."
      },
      {
        name: "Bicep Curls",
        sets: "3 sets × 10–12 reps",
        tip: "Avoid swinging your body and move slowly."
      }
    ]
  },

  {
    day: 2,
    title: "Lower Body",
    tag: "Strength",
    time: "45 min",
    level: "Beginner",
    focus: "Strength",
    description: "Build strong legs and improve lower-body control.",
    exercises: [
      {
        name: "Bodyweight Squats",
        sets: "3 sets × 10–15 reps",
        tip: "Keep your chest up and push through your heels."
      },
      {
        name: "Reverse Lunges",
        sets: "3 sets × 8–10 each leg",
        tip: "Step back under control and keep your front knee stable."
      },
      {
        name: "Glute Bridges",
        sets: "3 sets × 12 reps",
        tip: "Squeeze your glutes at the top of every rep."
      },
      {
        name: "Calf Raises",
        sets: "3 sets × 15 reps",
        tip: "Pause briefly at the top and lower slowly."
      }
    ]
  },

  {
    day: 3,
    title: "Active Recovery",
    tag: "Recovery",
    time: "30 min",
    level: "All levels",
    focus: "Recovery",
    description: "Move your body gently and give your muscles time to recover.",
    exercises: [
      {
        name: "Easy Walk",
        sets: "20 minutes",
        tip: "Walk at a comfortable pace where you can still talk."
      },
      {
        name: "Hip Mobility",
        sets: "5 minutes",
        tip: "Move slowly and stay within a comfortable range."
      },
      {
        name: "Shoulder Mobility",
        sets: "5 minutes",
        tip: "Keep movements smooth and avoid forcing the stretch."
      },
      {
        name: "Light Stretching",
        sets: "5–10 minutes",
        tip: "Relax and breathe normally while stretching."
      }
    ]
  },

  {
    day: 4,
    title: "Full Body",
    tag: "Strength",
    time: "50 min",
    level: "Beginner",
    focus: "Full Body",
    description: "Train your whole body with simple, effective movements.",
    exercises: [
      {
        name: "Squats",
        sets: "3 sets × 12 reps",
        tip: "Keep your feet planted and chest lifted."
      },
      {
        name: "Push-ups",
        sets: "3 sets × 8–12 reps",
        tip: "Keep your body in a straight line."
      },
      {
        name: "Dumbbell Rows",
        sets: "3 sets × 10 reps",
        tip: "Pull with control and avoid twisting."
      },
      {
        name: "Glute Bridges",
        sets: "3 sets × 12 reps",
        tip: "Drive through your heels and squeeze at the top."
      },
      {
        name: "Plank",
        sets: "3 sets × 20–30 sec",
        tip: "Keep your core tight and avoid letting your hips drop."
      }
    ]
  },

  {
    day: 5,
    title: "Cardio + Core",
    tag: "Fitness",
    time: "40 min",
    level: "Beginner",
    focus: "Fitness",
    description: "Build fitness and strengthen your core at a comfortable pace.",
    exercises: [
      {
        name: "Brisk Walk or Cardio",
        sets: "20 minutes",
        tip: "Choose a pace that raises your heart rate but feels manageable."
      },
      {
        name: "Marching High Knees",
        sets: "3 sets × 30 sec",
        tip: "Stay controlled and keep your core engaged."
      },
      {
        name: "Dead Bugs",
        sets: "3 sets × 10 each side",
        tip: "Keep your lower back gently pressed down."
      },
      {
        name: "Plank",
        sets: "3 sets × 20–30 sec",
        tip: "Breathe steadily and keep your body aligned."
      }
    ]
  },

  {
    day: 6,
    title: "Optional Workout",
    tag: "Flexible",
    time: "30–45 min",
    level: "Your choice",
    focus: "Enjoyment",
    description: "Choose movement you enjoy. The goal is to stay active without pressure.",
    exercises: [
      {
        name: "Choose Your Activity",
        sets: "20–30 minutes",
        tip: "Walking, cycling, swimming, football or anything you enjoy."
      },
      {
        name: "Mobility",
        sets: "5–10 minutes",
        tip: "Focus on any areas that feel tight."
      },
      {
        name: "Light Core Work",
        sets: "2–3 sets",
        tip: "Choose a comfortable core exercise you know."
      }
    ]
  },

  {
    day: 7,
    title: "Rest & Recover",
    tag: "Recovery",
    time: "Your choice",
    level: "All levels",
    focus: "Recovery",
    description: "Rest, recover and prepare yourself for another strong week.",
    exercises: [
      {
        name: "Hydrate",
        sets: "Throughout the day",
        tip: "Drink regularly and listen to your body's needs."
      },
      {
        name: "Light Movement",
        sets: "Optional 10–20 min",
        tip: "A gentle walk is enough if you feel like moving."
      },
      {
        name: "Prepare for Next Week",
        sets: "5 minutes",
        tip: "Think about when your next ShiftFit workout will happen."
      }
    ]
  }

];


/* =========================
   APP STATE
========================= */

let currentDay = null;
let completedExercises = new Set();

let completedDays =
  JSON.parse(localStorage.getItem("shiftfitCompletedDays")) || [];


/* =========================
   RENDER 7 DAY PLAN
========================= */

function renderPlan(){

  const container =
    document.getElementById("planCards");

  container.innerHTML = "";

  workoutPlan.forEach(workout => {

    const isCompleted =
      completedDays.includes(workout.day);

    const card =
      document.createElement("div");

    card.className =
      "plan-card" +
      (isCompleted ? " completed-day" : "");

    card.onclick = () =>
      openWorkout(workout.day);

    card.innerHTML = `
      <div class="day-label">
        DAY ${workout.day}
      </div>

      ${isCompleted ? `
        <div class="day-complete">✓</div>
      ` : ""}

      <div class="plan-title">
        ${workout.title}
      </div>

      <span class="tag">
        ${workout.tag}
      </span>

      <p class="plan-text">
        ${getExercisePreview(workout)}
      </p>
    `;

    container.appendChild(card);

  });

}


function getExercisePreview(workout){

  return workout.exercises
    .map(exercise => exercise.name)
    .join(" • ");

}


/* =========================
   OPEN WORKOUT
========================= */

function openWorkout(dayNumber){

  currentDay =
    workoutPlan.find(
      workout => workout.day === dayNumber
    );

  completedExercises.clear();

  document.getElementById("planScreen")
    .classList.add("hidden");

  document.getElementById("successScreen")
    .classList.add("hidden");

  document.getElementById("workoutScreen")
    .classList.remove("hidden");


  document.getElementById("workoutDayLabel")
    .textContent =
    "DAY " + currentDay.day;

  document.getElementById("workoutTitle")
    .textContent =
    currentDay.title;

  document.getElementById("workoutSubtitle")
    .textContent =
    currentDay.description;

  document.getElementById("workoutTime")
    .textContent =
    currentDay.time;

  document.getElementById("workoutLevel")
    .textContent =
    currentDay.level;

  document.getElementById("workoutFocus")
    .textContent =
    currentDay.focus;


  renderExercises();

  updateProgress();

  window.scrollTo(0,0);

}


/* =========================
   RENDER EXERCISES
========================= */

function renderExercises(){

  const container =
    document.getElementById("exerciseList");

  container.innerHTML = "";

  currentDay.exercises.forEach(
    (exercise,index) => {

      const card =
        document.createElement("div");

      card.className =
        "exercise-card";

      card.onclick =
        () => toggleExercise(index,card);

      card.innerHTML = `

        <div class="check"></div>

        <div class="exercise-content">

          <div class="exercise-title">
            ${index + 1}. ${exercise.name}
          </div>

          <div class="exercise-sets">
            ${exercise.sets}
          </div>

          <div class="exercise-tip">
            ${exercise.tip}
          </div>

        </div>
      `;

      container.appendChild(card);

    }
  );

}


/* =========================
   TOGGLE EXERCISE
========================= */

function toggleExercise(index,card){

  if(completedExercises.has(index)){

    completedExercises.delete(index);

    card.classList.remove("completed");

    card.querySelector(".check")
      .innerHTML = "";

  }else{

    completedExercises.add(index);

    card.classList.add("completed");

    card.querySelector(".check")
      .innerHTML = "✓";

  }

  updateProgress();

}


/* =========================
   UPDATE PROGRESS
========================= */

function updateProgress(){

  const completed =
    completedExercises.size;

  const total =
    currentDay.exercises.length;

  document.getElementById("progressText")
    .textContent =
    completed + " / " + total;

  document.getElementById("progressFill")
    .style.width =
    (completed / total * 100) + "%";


  const button =
    document.getElementById("finishButton");


  if(completed === total){

    button.disabled = false;

    button.classList.add("ready");

    button.textContent =
      "FINISH WORKOUT 🏆";

  }else{

    button.disabled = true;

    button.classList.remove("ready");

    button.textContent =
      "COMPLETE ALL EXERCISES";

  }

}


/* =========================
   FINISH WORKOUT
========================= */

function finishWorkout(){

  if(!completedDays.includes(currentDay.day)){

    completedDays.push(currentDay.day);

    localStorage.setItem(
      "shiftfitCompletedDays",
      JSON.stringify(completedDays)
    );

  }


  document.getElementById("workoutScreen")
    .classList.add("hidden");

  document.getElementById("successScreen")
    .classList.remove("hidden");


  document.getElementById("successMessage")
    .textContent =
    `Great work, Andrew! You completed Day ${currentDay.day} of your ShiftFit plan. 💪`;


  document.getElementById("successMotivation")
    .textContent =
    `${completedDays.length} of 7 days complete. Keep building the habit.`;


  window.scrollTo(0,0);

}


/* =========================
   SHOW PLAN
========================= */

function showPlan(){

  document.getElementById("workoutScreen")
    .classList.add("hidden");

  document.getElementById("successScreen")
    .classList.add("hidden");

  document.getElementById("planScreen")
    .classList.remove("hidden");

  renderPlan();

  window.scrollTo(0,0);

}


/* =========================
   START APP
========================= */

renderPlan();

</script>

</body>
</html>

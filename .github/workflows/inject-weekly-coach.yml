name: Inject Weekly Coach

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-weekly-coach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject weekly coach script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          tag = '<script src="./weekly-coach.js"></script>'
          if tag not in text:
              marker = '<script src="./goal-journey.js"></script>'
              if marker in text:
                  text = text.replace(marker, marker + '\n' + tag, 1)
              else:
                  text = text.replace('</body>', tag + '\n</body>', 1)
              p.write_text(text)
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire weekly coach dashboard"
          git push

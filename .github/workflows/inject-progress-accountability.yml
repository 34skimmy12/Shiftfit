name: Inject Progress Accountability

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-progress-accountability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject progress, profile and data scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          tags = [
              '<script src="./progress-accountability.js"></script>',
              '<script src="./goal-journey.js"></script>',
              '<script src="./data-privacy.js"></script>',
              '<script src="./profile-entry.js"></script>',
          ]
          for tag in tags:
              if tag not in text:
                  marker = '</body>'
                  text = text.replace(marker, tag + '\n' + marker, 1)
          p.write_text(text)
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire profile and data privacy"
          git push
